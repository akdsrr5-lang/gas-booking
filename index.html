<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>閉栓・開栓 お申し込み</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#f0f4f8;min-height:100vh;font-size:14px;}
.header{background:linear-gradient(135deg,#1a3a5c,#2563a8);padding:16px;color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:15px;font-weight:700;}
.header p{font-size:11px;opacity:.65;margin-top:3px;}
.admin-btn{font-size:10px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);cursor:pointer;}
.admin-btn.on{background:#e67e22;border-color:#e67e22;}
.tab-bar{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;}
.tab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:600;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s;}
.tab.active{color:#1a3a5c;border-bottom-color:#1a3a5c;}
.wrap{padding:14px;max-width:480px;margin:0 auto;}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px;overflow:hidden;}
.card-hd{background:linear-gradient(135deg,#1a3a5c,#2563a8);color:#fff;padding:12px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.card-bd{padding:16px;}
.steps{display:flex;gap:6px;margin-bottom:14px;}
.step{flex:1;height:4px;border-radius:99px;background:#e2e8f0;transition:.3s;}
.step.done{background:#1a3a5c;}
.step.act{background:#60a5fa;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav button{width:32px;height:32px;border:none;background:#f1f5f9;border-radius:8px;cursor:pointer;font-size:18px;color:#475569;}
.cal-nav button:disabled{opacity:.3;cursor:default;}
.cal-month{font-size:15px;font-weight:700;color:#1e293b;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-lbl{text-align:center;font-size:11px;font-weight:600;padding:4px 0;color:#94a3b8;}
.cal-lbl:first-child{color:#ef4444;}
.cal-lbl:last-child{color:#3b82f6;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;color:#334155;position:relative;transition:.15s;user-select:none;}
.cal-day:hover:not(.dis):not(.emp){background:#dbeafe;}
.cal-day.dis{color:#cbd5e1;cursor:not-allowed;}
.cal-day.holiday{color:#ef4444 !important;}
.cal-day.dis.holiday{color:#fca5a5 !important;}
.cal-day.sun{color:#ef4444;}
.cal-day.dis.sun{color:#fca5a5;}
.cal-day.tod{background:#e0f2fe;font-weight:700;color:#1a3a5c;}
.cal-day.sel{background:#1a3a5c!important;color:#fff!important;}
.cal-day.dot::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#ef4444;}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.slot{padding:10px 4px;border-radius:10px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;border:2px solid #e2e8f0;color:#334155;background:#fff;}
.slot:hover:not(.blk):not(.bkd){border-color:#1a3a5c;color:#1a3a5c;background:#f0f4ff;}
.slot.sel{background:#1a3a5c;color:#fff;border-color:#1a3a5c;}
.slot.blk{background:#fef2f2;color:#ef4444;border-color:#fecaca;cursor:not-allowed;}
.slot.auto-blk{background:#fef3c7;color:#92400e;border-color:#fcd34d;cursor:not-allowed;}
.slot.bkd{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0;cursor:not-allowed;}
.slot-st{font-size:9px;font-weight:400;margin-top:2px;opacity:.8;}
.slot.a-blk{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
.slot.a-auto{background:#fef3c7;color:#92400e;border-color:#fcd34d;cursor:not-allowed;}
.slot.a-free{background:#f0fdf4;color:#166534;border-color:#bbf7d0;}
.slot.a-bkd{background:#e0f2fe;color:#0369a1;border-color:#7dd3fc;cursor:pointer;}
.slot.a-bkd:hover{background:#bae6fd;}
.fg{margin-bottom:13px;}
.fl{font-size:12px;font-weight:600;color:#475569;margin-bottom:5px;display:block;}
.fl span{color:#ef4444;}
.fi,.ft{width:100%;padding:10px 13px;border:2px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:inherit;color:#1e293b;background:#fafafa;outline:none;transition:.2s;}
.fi:focus,.ft:focus{border-color:#1a3a5c;background:#fff;}
.ft{min-height:88px;resize:vertical;}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;}
.btn-p{background:linear-gradient(135deg,#1a3a5c,#2563a8);color:#fff;}
.btn-p:hover{opacity:.9;}
.btn-p:disabled{opacity:.4;cursor:not-allowed;}
.btn-o{background:#fff;border:2px solid #e2e8f0;color:#475569;margin-top:8px;}
.btn-o:hover{border-color:#1a3a5c;color:#1a3a5c;}
.sum{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:13px;margin-bottom:14px;}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;}
.sum-row:not(:last-child){border-bottom:1px solid #e2e8f0;}
.sum-l{color:#64748b;}
.sum-v{font-weight:600;color:#1e293b;}
.notice{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:11px 13px;font-size:11.5px;color:#92400e;line-height:1.6;}
.notice.grn{background:#f0fdf4;border-color:#86efac;color:#166534;}
.wknd{background:#fef2f2;border-radius:12px;padding:20px;text-align:center;color:#991b1b;}
.wknd .ico{font-size:32px;margin-bottom:8px;}
.wknd h3{font-size:14px;font-weight:700;margin-bottom:6px;}
.wknd p{font-size:12px;line-height:1.7;}
.ok-ico{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(16,185,129,.3);}
.ok-title{text-align:center;font-size:18px;font-weight:700;color:#1e293b;margin-bottom:8px;}
.ok-sub{text-align:center;font-size:12px;color:#64748b;line-height:1.8;}
.bk-item{background:#f8fafc;border-radius:10px;padding:12px 14px;border-left:4px solid #1a3a5c;margin-bottom:8px;}
.bk-time{font-size:13px;font-weight:700;color:#1a3a5c;}
.bk-name{font-size:12px;color:#334155;margin-top:2px;}
.bk-note{font-size:11px;color:#64748b;margin-top:3px;font-style:italic;}
.bk-id{font-size:10px;color:#94a3b8;margin-top:4px;}
.bk-actions{display:flex;gap:8px;margin-top:10px;}
.bk-btn{flex:1;padding:8px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.bk-btn-edit{background:#fef3c7;color:#92400e;}
.bk-btn-edit:hover{background:#fde68a;}
.bk-btn-cancel{background:#fee2e2;color:#991b1b;}
.bk-btn-cancel:hover{background:#fecaca;}
.empty{text-align:center;padding:20px;color:#94a3b8;font-size:12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto;}
.modal h2{font-size:16px;font-weight:700;text-align:center;margin-bottom:6px;}
.modal p{font-size:11px;color:#64748b;text-align:center;margin-bottom:18px;}
.pin-in{width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:12px;font-size:22px;text-align:center;letter-spacing:.4em;font-family:monospace;outline:none;transition:.2s;}
.pin-in:focus{border-color:#1a3a5c;}
.pin-err{color:#ef4444;font-size:11px;text-align:center;margin-top:8px;}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.btn-sm{padding:9px 0;font-size:12px;border-radius:9px;flex:1;border:none;cursor:pointer;font-weight:700;font-family:inherit;}
.saved{text-align:center;font-size:11px;color:#10b981;font-weight:600;padding:6px;}
.radio-group{display:flex;gap:10px;margin-top:4px;}
.radio-label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:#475569;transition:.15s;}
.radio-label.selected{border-color:#1a3a5c;background:#eff6ff;color:#1a3a5c;}
.radio-label input{display:none;}
.check-label{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;transition:.15s;}
.check-label.checked{border-color:#10b981;background:#f0fdf4;}
.check-label input{display:none;}
.check-box{width:20px;height:20px;border:2px solid #cbd5e1;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;}
.check-label.checked .check-box{background:#10b981;border-color:#10b981;color:#fff;}
.check-text{font-size:11.5px;color:#475569;line-height:1.6;}
.deposit-box{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:13px;margin-bottom:8px;}
.deposit-text{font-size:11.5px;color:#78350f;line-height:1.7;}
.confirm-modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.confirm-modal h3{font-size:16px;font-weight:700;margin-bottom:8px;color:#991b1b;}
.confirm-modal p{font-size:12px;color:#64748b;line-height:1.6;margin-bottom:20px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:#64748b;}
.legend-item{display:flex;align-items:center;gap:4px;}
.legend-dot{width:10px;height:10px;border-radius:50%;}
</style>
</head>
<body>
<div id="app"></div>
<script>
var ADMIN_PIN="1234";
var SLOTS=["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00"];
var DAYS=["日","月","火","水","木","金","土"];
var PAYMENT_OPTIONS=["ゆうちょ銀行","福岡銀行","福岡ひびき信用金庫","西日本シティ銀行","北九州農協","郵便払込用紙(毎月検針票と一緒)"];
var AUTO_BLOCK_TIMES=["09:00","10:00","11:00"];

// ── 祝日リスト（2025〜2026年） ────────────────────────────────
var HOLIDAYS={
  "2025-01-01":1,"2025-01-13":1,"2025-02-11":1,"2025-02-23":1,"2025-02-24":1,
  "2025-03-20":1,"2025-04-29":1,"2025-05-03":1,"2025-05-04":1,"2025-05-05":1,
  "2025-05-06":1,"2025-07-21":1,"2025-08-11":1,"2025-09-15":1,"2025-09-23":1,
  "2025-10-13":1,"2025-11-03":1,"2025-11-23":1,"2025-11-24":1,
  "2026-01-01":1,"2026-01-12":1,"2026-02-11":1,"2026-02-23":1,
  "2026-03-20":1,"2026-04-29":1,"2026-05-03":1,"2026-05-04":1,"2026-05-05":1,
  "2026-05-06":1,"2026-07-20":1,"2026-08-11":1,"2026-09-21":1,"2026-09-22":1,
  "2026-10-12":1,"2026-11-03":1,"2026-11-23":1,
  "2027-01-01":1,"2027-01-11":1,"2027-02-11":1,"2027-02-23":1,
  "2027-03-21":1,"2027-04-29":1,"2027-05-03":1,"2027-05-04":1,"2027-05-05":1
};

function isHoliday(dateStr){return !!HOLIDAYS[dateStr];}

// ── 月曜AM自動ブロック判定 ───────────────────────────────────
// 月曜が祝日→翌火曜の9〜11時を自動ブロック
// 通常月曜→月曜の9〜11時を自動ブロック
function isAutoBlocked(dateStr,time){
  if(AUTO_BLOCK_TIMES.indexOf(time)<0) return false;
  var d=new Date(dateStr+"T00:00:00");
  var day=d.getDay();
  if(day===1){// 月曜
    if(isHoliday(dateStr)) return false;// 月曜祝日→月曜はブロックしない
    return true;
  }
  if(day===2){// 火曜
    var prev=new Date(d); prev.setDate(d.getDate()-1);
    var prevStr=fmt(prev);
    if(isHoliday(prevStr)) return true;// 前日月曜が祝日→火曜ブロック
  }
  return false;
}

var state={
  tab:"customer",isAdmin:false,showPin:false,blocked:{},bookings:{},
  step:1,selDate:null,selTime:null,
  form:{name:"",phone:"",type:"閉栓",address:"",building:"",ownership:"",depositAgreed:false,payment:"",notes:""},
  submitting:false,doneId:null,
  custMonth:new Date(),adminMonth:new Date(),adminDate:null,savingMsg:false,
  editModal:null,confirmCancel:null
};
var SK_BLK="gas-blocked-v1",SK_BK="gas-bookings-v1";
function loadLS(k){try{return JSON.parse(localStorage.getItem(k)||"{}");}catch(e){return{};}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function fmt(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function p2(n){return String(n).padStart(2,"0");}
function today(){return fmt(new Date());}
function isWknd(d){return d.getDay()===0||d.getDay()===6;}
function isToday(d){return fmt(d)===today();}
function isPast(d){return fmt(d)<today();}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function q(id){return document.getElementById(id);}
function qa(s){return document.querySelectorAll(s);}
function addMonth(d,n){var r=new Date(d);r.setDate(1);r.setMonth(r.getMonth()+n);return r;}
function render(){document.getElementById("app").innerHTML=buildApp();bindEvents();}

function isFormValid(){
  var f=state.form;
  if(!f.name||!f.phone||!f.address||!f.ownership) return false;
  if(f.ownership==="賃貸"&&!f.depositAgreed) return false;
  if(f.type==="開栓"&&!f.payment) return false;
  return true;
}

function buildApp(){
  var modals="";
  if(state.showPin) modals+=buildPinModal();
  if(state.editModal) modals+=buildEditModal();
  if(state.confirmCancel) modals+=buildConfirmModal();
  return modals+
    '<div class="header"><div class="header-row"><div><h1>🔧 閉栓・開栓 お申し込み</h1><p>ガス停止・再開のご予約はこちらから</p></div>'+
    '<button class="admin-btn '+(state.isAdmin?"on":"")+'" id="adminBtn">'+(state.isAdmin?"🔓 管理者":"管理者")+'</button></div></div>'+
    (state.isAdmin?'<div class="tab-bar"><div class="tab '+(state.tab==="customer"?"active":"")+'" data-tab="customer">👤 お客様画面</div><div class="tab '+(state.tab==="admin"?"active":"")+'" data-tab="admin">⚙️ 管理画面</div></div>':"")+
    '<div class="wrap">'+(state.savingMsg?'<div class="saved">✓ 保存しました</div>':"")+
    (state.tab==="customer"?buildCustomer():buildAdmin())+'</div>';
}

function buildCustomer(){
  if(state.doneId) return buildSuccess();
  var ds=state.selDate?fmt(state.selDate):null;
  var blocked=ds?(state.blocked[ds]||[]):[];
  var booked=ds?(state.bookings[ds]||{}):{};
  var s=state.step;
  var html='<div class="steps">'+
    '<div class="step '+(s>1?"done":s===1?"act":"")+'"></div>'+
    '<div class="step '+(s>2?"done":s===2?"act":"")+'"></div>'+
    '<div class="step '+(s>2?"done":s===3?"act":"")+'"></div></div>';
  html+='<div class="card"><div class="card-hd">📅 STEP 1｜日程を選択</div><div class="card-bd">'+
    buildCalendar("cust",state.custMonth,state.selDate)+
    '<div style="height:10px"></div>'+
    '<div class="legend">'+
    '<div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>日曜・祝日（休業）</div>'+
    '<div class="legend-item"><div class="legend-dot" style="background:#ef4444;opacity:.5"></div>対応不可あり</div>'+
    '</div>'+
    '<div style="height:8px"></div>'+
    '<div class="notice">⚠️ 当日・土日・祝日のご予約はお電話にてお問い合わせください。</div></div></div>';
  if(state.selDate){
    html+='<div class="card"><div class="card-hd">🕐 STEP 2｜時間帯を選択</div><div class="card-bd">';
    if(isWknd(state.selDate)||isToday(state.selDate)||isHoliday(fmt(state.selDate))){
      html+='<div class="wknd"><div class="ico">📞</div><h3>この日はオンライン予約できません</h3><p>土日・祝日・当日のご予約は<br>お電話にてお問い合わせください。</p></div>';
    }else{html+=buildTimeSlots(blocked,booked,state.selTime,ds);}
    html+='</div></div>';
  }
  if(state.selDate&&state.selTime&&!isWknd(state.selDate)&&!isToday(state.selDate)&&!isHoliday(fmt(state.selDate))){
    var f=state.form;
    html+='<div class="card"><div class="card-hd">📝 STEP 3｜お客様情報を入力</div><div class="card-bd">';
    html+='<div class="sum"><div class="sum-row"><span class="sum-l">日程</span><span class="sum-v">'+state.selDate.getFullYear()+'年'+(state.selDate.getMonth()+1)+'月'+state.selDate.getDate()+'日（'+DAYS[state.selDate.getDay()]+'）</span></div><div class="sum-row"><span class="sum-l">時間</span><span class="sum-v">'+state.selTime+'〜</span></div></div>';
    html+='<div class="fg"><label class="fl">申し込み種別 <span>*</span></label><select class="fi" id="fType"><option '+(f.type==="閉栓"?"selected":"")+'>閉栓</option><option '+(f.type==="開栓"?"selected":"")+'>開栓</option></select></div>';
    html+='<div class="fg"><label class="fl">お名前 <span>*</span></label><input class="fi" id="fName" placeholder="山田 太郎" value="'+esc(f.name)+'"></div>';
    html+='<div class="fg"><label class="fl">電話番号 <span>*</span></label><input class="fi" id="fPhone" type="tel" placeholder="090-0000-0000" value="'+esc(f.phone)+'"></div>';
    html+='<div class="fg"><label class="fl">住所 <span>*</span></label><input class="fi" id="fAddress" placeholder="北九州市○○区○○町1-2-3" value="'+esc(f.address)+'"></div>';
    html+='<div class="fg"><label class="fl">アパート・マンション名</label><input class="fi" id="fBuilding" placeholder="○○マンション 101号室" value="'+esc(f.building)+'"></div>';
    html+='<div class="fg"><label class="fl">住居の種別 <span>*</span></label>'+
      '<div class="radio-group">'+
      '<label class="radio-label '+(f.ownership==="持家"?"selected":"")+'"><input type="radio" name="ownership" value="持家">🏠 持家</label>'+
      '<label class="radio-label '+(f.ownership==="賃貸"?"selected":"")+'"><input type="radio" name="ownership" value="賃貸">🏢 賃貸</label>'+
      '</div></div>';
    if(f.ownership==="賃貸"){
      html+='<div class="fg"><label class="fl">保証金について <span>*</span></label>'+
        '<div class="deposit-box"><p class="deposit-text">ガスの契約時に<strong>1万円の保証金</strong>をお預かりさせていただいております。これは使用料金を滞納されたときや停止手続きを行わずに転居された場合の預り金となります。<br><br>退去・解約時にご返金いたします。</p></div>'+
        '<label class="check-label '+(f.depositAgreed?"checked":"")+'"><input type="checkbox" id="fDeposit" '+(f.depositAgreed?"checked":"")+'>'+
        '<div class="check-box">'+(f.depositAgreed?"✓":"")+'</div>'+
        '<span class="check-text">同意しました</span></label></div>';
    }
    if(f.type==="開栓"){
      html+='<div class="fg"><label class="fl">お支払い方法 <span>*</span></label>'+
        '<select class="fi" id="fPayment"><option value="">選択してください</option>'+
        PAYMENT_OPTIONS.map(function(o){return'<option value="'+o+'" '+(f.payment===o?"selected":"")+'>'+o+'</option>';}).join("")+
        '</select></div>';
    }
    html+='<div class="fg"><label class="fl">備考</label><textarea class="ft" id="fNotes" placeholder="ご要望など">'+esc(f.notes)+'</textarea></div>';
    var dis=isFormValid()?"":"disabled";
    html+='<button class="btn btn-p" id="submitBtn" '+dis+'>'+(state.submitting?"送信中…":"✓ 予約を確定する")+'</button>';
    html+='</div></div>';
  }
  return html;
}

function buildSuccess(){

function buildCalendar(ns,viewDate,selDate){
  var yr=viewDate.getFullYear(),mo=viewDate.getMonth();
  var firstDay=new Date(yr,mo,1).getDay();
  var dim=new Date(yr,mo+1,0).getDate();
  var now=new Date();now.setHours(0,0,0,0);
  var canPrev=new Date(yr,mo,1)>new Date(now.getFullYear(),now.getMonth(),1);
  var cells="";
  for(var i=0;i<firstDay;i++) cells+='<div class="cal-day emp"></div>';
  for(var d=1;d<=dim;d++){
    var date=new Date(yr,mo,d);
    var ds=fmt(date);
    var isSun=date.getDay()===0;
    var isSat=date.getDay()===6;
    var isHol=isHoliday(ds);
    var dis=isPast(date)||isToday(date)||isSun||isSat||isHol;
    var isSel=selDate&&fmt(selDate)===ds;
    var isTod=isToday(date);
    var hasBlk=(state.blocked[ds]||[]).length>0||Object.keys(state.bookings[ds]||{}).length>0;
    var cls="cal-day";
    if(isTod) cls+=" tod";
    if(dis) cls+=" dis";
    if(isSun||isHol) cls+=" holiday";// 日曜・祝日を赤く
    if(isSat&&!isHol) cls+=" ";// 土曜はデフォルト
    if(isSel) cls+=" sel";
    if(hasBlk&&!dis) cls+=" dot";
    cells+='<div class="'+cls+'" data-cal="'+ns+'" data-date="'+ds+'" data-dis="'+(dis?1:0)+'">'+d+'</div>';
  }
  return '<div class="cal-nav"><button id="'+ns+'PrevM" '+(canPrev?"":"disabled")+'>‹</button><span class="cal-month">'+yr+'年 '+(mo+1)+'月</span><button id="'+ns+'NextM">›</button></div>'+
    '<div class="cal-grid">'+DAYS.map(function(d,i){return'<div class="cal-lbl" style="'+(i===0||i===6?"color:#ef4444":"")+'">'+d+'</div>';}).join("")+cells+'</div>';
}

function buildTimeSlots(blocked,booked,sel,ds){
  return '<div class="time-grid">'+SLOTS.map(function(t){
    var isBlk=blocked.indexOf(t)>=0;
    var isBkd=!!booked[t];
    var isAuto=isAutoBlocked(ds,t);
    var isSel=sel===t;
    var cls="slot";
    if(isBkd) cls+=" bkd";
    else if(isAuto) cls+=" auto-blk";
    else if(isBlk) cls+=" blk";
    else if(isSel) cls+=" sel";
    var st=isBkd?"× 予約済":isAuto?"× AM対応不可":isBlk?"× 対応不可":"○ 空き";
    return '<div class="'+cls+'" data-slot="'+t+'">'+t+'<div class="slot-st">'+st+'</div></div>';
  }).join("")+'</div>';
}

function buildAdminSlots(blocked,booked,ds){
  return '<div class="time-grid">'+SLOTS.map(function(t){
    var isBkd=!!booked[t];
    var isBlk=blocked.indexOf(t)>=0;
    var isAuto=isAutoBlocked(ds,t);
    var cls="slot";
    if(isBkd) cls+=" a-bkd";
    else if(isAuto) cls+=" a-auto";
    else if(isBlk) cls+=" a-blk";
    else cls+=" a-free";
    var st=isBkd?"📋 予約済":isAuto?"🟡 自動ブロック":isBlk?"× ブロック":"○ 対応可";
    return '<div class="'+cls+'" data-admin-slot="'+t+'" data-is-bkd="'+(isBkd?1:0)+'" data-is-auto="'+(isAuto?1:0)+'">'+t+'<div class="slot-st">'+st+'</div></div>';
  }).join("")+'</div>';
}

function bindEvents(){
  q("adminBtn")&&q("adminBtn").addEventListener("click",function(){
    if(state.isAdmin){state.isAdmin=false;state.tab="customer";render();}
    else{state.showPin=true;render();}
  });
  qa("[data-tab]").forEach(function(el){el.addEventListener("click",function(){state.tab=el.dataset.tab;render();});});
  qa("[data-cal]").forEach(function(el){el.addEventListener("click",function(){
    if(el.dataset.dis==="1") return;
    var d=new Date(el.dataset.date+"T00:00:00");
    if(el.dataset.cal==="cust"){state.selDate=d;state.selTime=null;state.step=2;render();}
    else{state.adminDate=d;render();}
  });});
  q("custPrevM")&&q("custPrevM").addEventListener("click",function(){state.custMonth=addMonth(state.custMonth,-1);render();});
  q("custNextM")&&q("custNextM").addEventListener("click",function(){state.custMonth=addMonth(state.custMonth,1);render();});
  q("adminPrevM")&&q("adminPrevM").addEventListener("click",function(){state.adminMonth=addMonth(state.adminMonth,-1);render();});
  q("adminNextM")&&q("adminNextM").addEventListener("click",function(){state.adminMonth=addMonth(state.adminMonth,1);render();});
  qa("[data-slot]").forEach(function(el){el.addEventListener("click",function(){
    if(el.classList.contains("blk")||el.classList.contains("bkd")||el.classList.contains("auto-blk")) return;
    state.selTime=el.dataset.slot;state.step=3;render();
  });});
  q("fType")&&q("fType").addEventListener("change",function(e){state.form.type=e.target.value;render();});
  q("fName")&&q("fName").addEventListener("input",function(e){state.form.name=e.target.value;syncSubmit();});
  q("fPhone")&&q("fPhone").addEventListener("input",function(e){state.form.phone=e.target.value;syncSubmit();});
  q("fAddress")&&q("fAddress").addEventListener("input",function(e){state.form.address=e.target.value;syncSubmit();});
  q("fBuilding")&&q("fBuilding").addEventListener("input",function(e){state.form.building=e.target.value;});
  q("fNotes")&&q("fNotes").addEventListener("input",function(e){state.form.notes=e.target.value;});
  q("fPayment")&&q("fPayment").addEventListener("change",function(e){state.form.payment=e.target.value;syncSubmit();});
  q("fDeposit")&&q("fDeposit").addEventListener("change",function(e){state.form.depositAgreed=e.target.checked;syncSubmit();render();});
  qa("input[name='ownership']").forEach(function(el){el.addEventListener("change",function(){state.form.ownership=el.value;state.form.depositAgreed=false;syncSubmit();render();});});
  q("submitBtn")&&q("submitBtn").addEventListener("click",submitBooking);
  q("resetBtn")&&q("resetBtn").addEventListener("click",function(){
    state.step=1;state.selDate=null;state.selTime=null;state.doneId=null;
    state.form={name:"",phone:"",type:"閉栓",address:"",building:"",ownership:"",depositAgreed:false,payment:"",notes:""};render();
  });
  qa("[data-admin-slot]").forEach(function(el){el.addEventListener("click",function(){
    var t=el.dataset.adminSlot;
    var isBkd=el.dataset.isBkd==="1";
    var isAuto=el.dataset.isAuto==="1";
    if(isAuto) return;// 自動ブロックは変更不可
    var ds=fmt(state.adminDate);
    if(isBkd){
      var bk=state.bookings[ds]&&state.bookings[ds][t];
      if(bk){state.editModal={date:ds,time:t,bk:Object.assign({},bk)};render();}
    } else {
      var cur=state.blocked[ds]||[];
      if(cur.indexOf(t)>=0){state.blocked[ds]=cur.filter(function(x){return x!==t;});}
      else{state.blocked[ds]=cur.concat([t]);}
      saveLS(SK_BLK,state.blocked);
      state.savingMsg=true;render();
      setTimeout(function(){state.savingMsg=false;render();},1200);
    }
  });});
  qa("[data-edit-date]").forEach(function(el){el.addEventListener("click",function(){
    var ds=el.dataset.editDate,t=el.dataset.editTime;
    var bk=state.bookings[ds]&&state.bookings[ds][t];
    if(bk){state.editModal={date:ds,time:t,bk:Object.assign({},bk)};render();}
  });});
  qa("[data-cancel-date]").forEach(function(el){el.addEventListener("click",function(){
    state.confirmCancel={date:el.dataset.cancelDate,time:el.dataset.cancelTime};render();
  });});
  q("editOverlay")&&q("editOverlay").addEventListener("click",function(){state.editModal=null;render();});
  q("editModal")&&q("editModal").addEventListener("click",function(e){e.stopPropagation();});
  q("editCancel")&&q("editCancel").addEventListener("click",function(){state.editModal=null;render();});
  q("editSave")&&q("editSave").addEventListener("click",function(){
    var em=state.editModal;
    if(!state.bookings[em.date]) return;
    state.bookings[em.date][em.time].type=q("emType").value;
    state.bookings[em.date][em.time].name=q("emName").value;
    state.bookings[em.date][em.time].phone=q("emPhone").value;
    state.bookings[em.date][em.time].address=q("emAddress").value;
    state.bookings[em.date][em.time].building=q("emBuilding").value;
    state.bookings[em.date][em.time].ownership=q("emOwnership").value;
    state.bookings[em.date][em.time].payment=q("emPayment").value;
    state.bookings[em.date][em.time].notes=q("emNotes").value;
    saveLS(SK_BK,state.bookings);
    state.editModal=null;state.savingMsg=true;render();
    setTimeout(function(){state.savingMsg=false;render();},1200);
  });
  q("confirmOverlay")&&q("confirmOverlay").addEventListener("click",function(){state.confirmCancel=null;render();});
  q("confirmNo")&&q("confirmNo").addEventListener("click",function(){state.confirmCancel=null;render();});
  q("confirmYes")&&q("confirmYes").addEventListener("click",function(){
    var cc=state.confirmCancel;
    if(state.bookings[cc.date]){
      delete state.bookings[cc.date][cc.time];
      if(Object.keys(state.bookings[cc.date]).length===0) delete state.bookings[cc.date];
    }
    saveLS(SK_BK,state.bookings);
    state.confirmCancel=null;state.savingMsg=true;render();
    setTimeout(function(){state.savingMsg=false;render();},1200);
  });
  q("pinOverlay")&&q("pinOverlay").addEventListener("click",function(){state.showPin=false;render();});
  q("pinModal")&&q("pinModal").addEventListener("click",function(e){e.stopPropagation();});
  q("pinCancel")&&q("pinCancel").addEventListener("click",function(){state.showPin=false;render();});
  q("pinOk")&&q("pinOk").addEventListener("click",checkPin);
  q("pinIn")&&q("pinIn").addEventListener("keydown",function(e){if(e.key==="Enter")checkPin();});
  setTimeout(function(){q("pinIn")&&q("pinIn").focus();},50);
}

function syncSubmit(){
  var btn=q("submitBtn");
  if(btn) btn.disabled=!isFormValid()||state.submitting;
}
function checkPin(){
  var v=q("pinIn")?q("pinIn").value:"";
  if(v===ADMIN_PIN){state.showPin=false;state.isAdmin=true;state.tab="admin";render();}
  else{var err=q("pinErr");if(err)err.textContent="PINが正しくありません";var inp=q("pinIn");if(inp){inp.value="";inp.focus();}}
}
function submitBooking(){
  if(!isFormValid()) return;
  state.submitting=true;render();
  var id="BK"+Date.now();
  var ds=fmt(state.selDate); var f=state.form;
  if(!state.bookings[ds]) state.bookings[ds]={};
  state.bookings[ds][state.selTime]={id:id,name:f.name,phone:f.phone,type:f.type,address:f.address,building:f.building,ownership:f.ownership,depositAgreed:f.depositAgreed,payment:f.payment,notes:f.notes,createdAt:new Date().toISOString()};
  saveLS(SK_BK,state.bookings);
  state.doneId=id;state.submitting=false;render();
}

state.blocked=loadLS(SK_BLK);
state.bookings=loadLS(SK_BK);
render();
</script>
