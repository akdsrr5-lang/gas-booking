<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>閉栓・開栓 お申し込み</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#f0f4f8;min-height:100vh;font-size:14px;}

.header{background:linear-gradient(135deg,#1a3a5c,#2563a8);padding:16px;color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:15px;font-weight:700;}
.header p{font-size:11px;opacity:.65;margin-top:3px;}
.admin-btn{font-size:10px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);cursor:pointer;}
.admin-btn.on{background:#e67e22;border-color:#e67e22;}

.tab-bar{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;}
.tab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:600;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s;}
.tab.active{color:#1a3a5c;border-bottom-color:#1a3a5c;}

.wrap{padding:14px;max-width:480px;margin:0 auto;}

.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px;overflow:hidden;}
.card-hd{background:linear-gradient(135deg,#1a3a5c,#2563a8);color:#fff;padding:12px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.card-bd{padding:16px;}

/* Steps */
.steps{display:flex;gap:6px;margin-bottom:14px;}
.step{flex:1;height:4px;border-radius:99px;background:#e2e8f0;transition:.3s;}
.step.done{background:#1a3a5c;}
.step.act{background:#60a5fa;}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav button{width:32px;height:32px;border:none;background:#f1f5f9;border-radius:8px;cursor:pointer;font-size:18px;color:#475569;}
.cal-nav button:disabled{opacity:.3;cursor:default;}
.cal-month{font-size:15px;font-weight:700;color:#1e293b;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-lbl{text-align:center;font-size:11px;font-weight:600;padding:4px 0;color:#94a3b8;}
.cal-lbl:first-child{color:#ef4444;}
.cal-lbl:last-child{color:#3b82f6;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;color:#334155;position:relative;transition:.15s;user-select:none;}
.cal-day:hover:not(.dis):not(.emp){background:#dbeafe;}
.cal-day.dis{color:#cbd5e1;cursor:not-allowed;}
.cal-day.tod{background:#e0f2fe;font-weight:700;color:#1a3a5c;}
.cal-day.sel{background:#1a3a5c!important;color:#fff!important;}
.cal-day.dot::after{content:’’;position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#ef4444;}

/* Time grid */
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.slot{padding:10px 4px;border-radius:10px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;border:2px solid #e2e8f0;color:#334155;background:#fff;}
.slot:hover:not(.blk):not(.bkd){border-color:#1a3a5c;color:#1a3a5c;background:#f0f4ff;}
.slot.sel{background:#1a3a5c;color:#fff;border-color:#1a3a5c;}
.slot.blk{background:#fef2f2;color:#ef4444;border-color:#fecaca;cursor:not-allowed;}
.slot.bkd{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0;cursor:not-allowed;}
.slot-st{font-size:9px;font-weight:400;margin-top:2px;opacity:.8;}

/* Admin slots */
.slot.a-blk{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
.slot.a-free{background:#f0fdf4;color:#166534;border-color:#bbf7d0;}
.slot.a-bkd{background:#f8fafc;color:#94a3b8;border-color:#e2e8f0;cursor:not-allowed;}

/* Form */
.fg{margin-bottom:13px;}
.fl{font-size:12px;font-weight:600;color:#475569;margin-bottom:5px;display:block;}
.fl span{color:#ef4444;}
.fi,.ft{width:100%;padding:10px 13px;border:2px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:inherit;color:#1e293b;background:#fafafa;outline:none;transition:.2s;}
.fi:focus,.ft:focus{border-color:#1a3a5c;background:#fff;}
.ft{min-height:88px;resize:vertical;}

/* Buttons */
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;}
.btn-p{background:linear-gradient(135deg,#1a3a5c,#2563a8);color:#fff;}
.btn-p:hover{opacity:.9;}
.btn-p:disabled{opacity:.4;cursor:not-allowed;}
.btn-o{background:#fff;border:2px solid #e2e8f0;color:#475569;margin-top:8px;}
.btn-o:hover{border-color:#1a3a5c;color:#1a3a5c;}

/* Summary */
.sum{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:13px;margin-bottom:14px;}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;}
.sum-row:not(:last-child){border-bottom:1px solid #e2e8f0;}
.sum-l{color:#64748b;}
.sum-v{font-weight:600;color:#1e293b;}

/* Notices */
.notice{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:11px 13px;font-size:11.5px;color:#92400e;line-height:1.6;}
.notice.red{background:#fef2f2;border-color:#fca5a5;color:#991b1b;}
.notice.grn{background:#f0fdf4;border-color:#86efac;color:#166534;}

/* Weekend block */
.wknd{background:#fef2f2;border-radius:12px;padding:20px;text-align:center;color:#991b1b;}
.wknd .ico{font-size:32px;margin-bottom:8px;}
.wknd h3{font-size:14px;font-weight:700;margin-bottom:6px;}
.wknd p{font-size:12px;line-height:1.7;}

/* Success */
.ok-ico{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(16,185,129,.3);}
.ok-title{text-align:center;font-size:18px;font-weight:700;color:#1e293b;margin-bottom:8px;}
.ok-sub{text-align:center;font-size:12px;color:#64748b;line-height:1.8;}

/* Booking items */
.bk-item{background:#f8fafc;border-radius:10px;padding:12px 14px;border-left:4px solid #1a3a5c;margin-bottom:8px;}
.bk-time{font-size:13px;font-weight:700;color:#1a3a5c;}
.bk-name{font-size:12px;color:#334155;margin-top:2px;}
.bk-note{font-size:11px;color:#64748b;margin-top:3px;font-style:italic;}
.bk-id{font-size:10px;color:#94a3b8;margin-top:4px;}

.empty{text-align:center;padding:20px;color:#94a3b8;font-size:12px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:#fff;border-radius:20px;padding:28px 24px;width:290px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h2{font-size:16px;font-weight:700;text-align:center;margin-bottom:6px;}
.modal p{font-size:11px;color:#64748b;text-align:center;margin-bottom:18px;}
.pin-in{width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:12px;font-size:22px;text-align:center;letter-spacing:.4em;font-family:monospace;outline:none;transition:.2s;}
.pin-in:focus{border-color:#1a3a5c;}
.pin-err{color:#ef4444;font-size:11px;text-align:center;margin-top:8px;}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.btn-sm{padding:9px 0;font-size:12px;border-radius:9px;flex:1;border:none;cursor:pointer;font-weight:700;font-family:inherit;}

.saved{text-align:center;font-size:11px;color:#10b981;font-weight:600;padding:6px;transition:.4s;}
</style>

</head>
<body>

<div id="app"></div>

<script>
// ── Config ──────────────────────────────────────────────────
const ADMIN_PIN = "1234";
const SLOTS = ["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00"];
const DAYS  = ["日","月","火","水","木","金","土"];

// ── State ────────────────────────────────────────────────────
let state = {
  tab: "customer",        // customer | admin
  isAdmin: false,
  showPin: false,
  blocked: {},            // { "2025-05-10": ["09:00","10:00"] }
  bookings: {},           // { "2025-05-10": { "09:00": {id,name,phone,type,notes} } }
  // customer steps
  step: 1,
  selDate: null,
  selTime: null,
  form: { name:"", phone:"", type:"閉栓", address:"", building:"", notes:"" },
  submitting: false,
  doneId: null,
  // calendar view months
  custMonth: new Date(),
  adminMonth: new Date(),
  adminDate: null,
  savingMsg: false,
};

// ── Storage ──────────────────────────────────────────────────
const SK_BLK = "gas-blocked-v1";
const SK_BK  = "gas-bookings-v1";

function loadLS(key){
  try{ return JSON.parse(localStorage.getItem(key)||"{}"); }catch{ return {}; }
}
function saveLS(key,val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch{}
}

// ── Helpers ──────────────────────────────────────────────────
function fmt(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function p2(n){ return String(n).padStart(2,"0"); }
function today(){ return fmt(new Date()); }
function isWknd(d){ return d.getDay()===0||d.getDay()===6; }
function isToday(d){ return fmt(d)===today(); }
function isPast(d){ return fmt(d)<today(); }

// ── Render ───────────────────────────────────────────────────
function render(){
  document.getElementById("app").innerHTML = buildApp();
  bindEvents();
}

function buildApp(){
  return `
    ${state.showPin ? buildPinModal() : ""}
    <div class="header">
      <div class="header-row">
        <div>
          <h1>🔧 閉栓・開栓 お申し込み</h1>
          <p>ガス停止・再開のご予約はこちらから</p>
        </div>
        <button class="admin-btn ${state.isAdmin?"on":""}" id="adminBtn">
          ${state.isAdmin?"🔓 管理者":"管理者"}
        </button>
      </div>
    </div>
    ${state.isAdmin ? `
    <div class="tab-bar">
      <div class="tab ${state.tab==="customer"?"active":""}" data-tab="customer">👤 お客様画面</div>
      <div class="tab ${state.tab==="admin"?"active":""}" data-tab="admin">⚙️ 管理画面</div>
    </div>` : ""}
    <div class="wrap">
      ${state.savingMsg ? `<div class="saved">✓ 保存しました</div>` : ""}
      ${state.tab==="customer" ? buildCustomer() : buildAdmin()}
    </div>
  `;
}

// ── Customer ─────────────────────────────────────────────────
function buildCustomer(){
  if(state.doneId) return buildSuccess();

  const ds = state.selDate ? fmt(state.selDate) : null;
  const blocked = ds ? (state.blocked[ds]||[]) : [];
  const booked  = ds ? (state.bookings[ds]||{}) : {};
  const step = state.step;

  return `
    <div class="steps">
      <div class="step ${step>1?"done":step===1?"act":""}"></div>
      <div class="step ${step>2?"done":step===2?"act":""}"></div>
      <div class="step ${step>2?"done":step===3?"act":""}"></div>
    </div>

    <div class="card">
      <div class="card-hd">📅 STEP 1｜日程を選択</div>
      <div class="card-bd">
        ${buildCalendar("cust", state.custMonth, state.selDate)}
        <div style="height:10px"></div>
        <div class="notice">⚠️ 当日・土日のご予約はお電話にてお問い合わせください。<br>🔴 赤いドットは一部時間帯が対応不可です。</div>
      </div>
    </div>

    ${state.selDate ? `
    <div class="card">
      <div class="card-hd">🕐 STEP 2｜時間帯を選択</div>
      <div class="card-bd">
        ${(isWknd(state.selDate)||isToday(state.selDate)) ? `
          <div class="wknd">
            <div class="ico">📞</div>
            <h3>この日はオンライン予約できません</h3>
            <p>土日・当日のご予約は<br>お電話にてお問い合わせください。</p>
          </div>
        ` : buildTimeSlots(blocked, booked, state.selTime, "cust")}
      </div>
    </div>` : ""}

    ${(state.selDate && state.selTime && !isWknd(state.selDate) && !isToday(state.selDate)) ? `
    <div class="card">
      <div class="card-hd">📝 STEP 3｜お客様情報を入力</div>
      <div class="card-bd">
        <div class="sum">
          <div class="sum-row"><span class="sum-l">日程</span>
            <span class="sum-v">${state.selDate.getFullYear()}年${state.selDate.getMonth()+1}月${state.selDate.getDate()}日（${DAYS[state.selDate.getDay()]}）</span></div>
          <div class="sum-row"><span class="sum-l">時間</span><span class="sum-v">${state.selTime}〜</span></div>
        </div>
        <div class="fg">
          <label class="fl">申し込み種別 <span>*</span></label>
          <select class="fi" id="fType">
            <option ${state.form.type==="閉栓"?"selected":""}>閉栓</option>
            <option ${state.form.type==="開栓"?"selected":""}>開栓</option>
          </select>
        </div>
        <div class="fg">
          <label class="fl">お名前 <span>*</span></label>
          <input class="fi" id="fName" placeholder="山田 太郎" value="${esc(state.form.name)}">
        </div>
        <div class="fg">
          <label class="fl">電話番号 <span>*</span></label>
          <input class="fi" id="fPhone" type="tel" placeholder="090-0000-0000" value="${esc(state.form.phone)}">
        </div>
        <div class="fg">
          <label class="fl">住所 <span>*</span></label>
          <input class="fi" id="fAddress" placeholder="北九州市○○区○○町1-2-3" value="${esc(state.form.address)}">
        </div>
        <div class="fg">
          <label class="fl">アパート・マンション名</label>
          <input class="fi" id="fBuilding" placeholder="○○マンション 101号室" value="${esc(state.form.building)}">
        </div>
        <div class="fg">
          <label class="fl">備考</label>
          <textarea class="ft" id="fNotes" placeholder="ご要望など">${esc(state.form.notes)}</textarea>

```
    </div>
    <button class="btn btn-p" id="submitBtn" ${(!state.form.name||!state.form.phone||!state.form.address||state.submitting)?"disabled":""}>
      ${state.submitting?"送信中…":"✓ 予約を確定する"}
    </button>
  </div>
</div>` : ""}
```

`;
}

function buildSuccess(){
const d = state.selDate;
return ` <div class="card"> <div class="card-bd" style="padding:32px 20px;text-align:center"> <div class="ok-ico">✓</div> <div class="ok-title">予約が完了しました</div> <div class="ok-sub"> 受付番号：<strong>${state.doneId}</strong><br> ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DAYS[d.getDay()]}）${state.selTime}〜<br> ${state.form.type} のご予約を承りました。<br><br> 担当者よりご連絡する場合がございます。 </div> <div style="height:16px"></div> <div class="notice grn">📞 変更・キャンセルはお電話にてご連絡ください。</div> <div style="height:14px"></div> <button class="btn btn-o" id="resetBtn">最初に戻る</button> </div> </div>`;
}

// ── Admin ─────────────────────────────────────────────────────
function buildAdmin(){
const ds = state.adminDate ? fmt(state.adminDate) : null;
const blocked = ds ? (state.blocked[ds]||[]) : [];
const booked  = ds ? (state.bookings[ds]||{}) : {};

return `
<div class="card">
<div class="card-hd">📅 日程を選択</div>
<div class="card-bd">
${buildCalendar(“admin”, state.adminMonth, state.adminDate)}
<div style="height:10px"></div>
<div class="notice">🔴 赤いドット = ブロック済みの時間帯あり</div>
</div>
</div>

```
${state.adminDate ? `
<div class="card">
  <div class="card-hd">
    🚫 対応不可の時間帯設定
    <span style="margin-left:auto;font-size:10px;opacity:.7">${state.adminDate.getFullYear()}年${state.adminDate.getMonth()+1}月${state.adminDate.getDate()}日</span>
  </div>
  <div class="card-bd">
    <p style="font-size:11px;color:#64748b;margin-bottom:12px">タップで対応不可／対応可を切り替え</p>
    ${buildAdminSlots(blocked, booked)}
  </div>
</div>

<div class="card">
  <div class="card-hd">
    📋 この日の予約一覧
    <span style="margin-left:auto;font-size:10px;opacity:.7">${Object.keys(booked).length}件</span>
  </div>
  <div class="card-bd">
    ${Object.keys(booked).length===0 ? `<div class="empty">予約はありません</div>` :
      Object.entries(booked).sort(([a],[b])=>a.localeCompare(b)).map(([t,bk])=>`
        <div class="bk-item">
          <div class="bk-time">${t}〜　${bk.type}</div>
          <div class="bk-name">👤 ${esc(bk.name)}　📞 ${esc(bk.phone)}</div>
          <div class="bk-note">📍 ${esc(bk.address)}${bk.building?" "+esc(bk.building):""}</div>
          ${bk.notes?`<div class="bk-note">💬 ${esc(bk.notes)}</div>`:""}
          <div class="bk-id">受付No: ${bk.id}</div>
        </div>`).join("")}
  </div>
</div>` : ""}
```

`;
}

// ── Calendar builder ──────────────────────────────────────────
function buildCalendar(ns, viewDate, selDate){
const yr = viewDate.getFullYear(), mo = viewDate.getMonth();
const firstDay = new Date(yr,mo,1).getDay();
const dim = new Date(yr,mo+1,0).getDate();
const now = new Date(); now.setHours(0,0,0,0);

const canPrev = new Date(yr,mo,1) > new Date(now.getFullYear(), now.getMonth(),1);

let cells = “”;
for(let i=0;i<firstDay;i++) cells+=`<div class="cal-day emp"></div>`;
for(let d=1;d<=dim;d++){
const date=new Date(yr,mo,d);
const ds=fmt(date);
const dis = isPast(date)||isToday(date)||isWknd(date);
const isSel = selDate && fmt(selDate)===ds;
const isTod = isToday(date);
const hasBlk = (state.blocked[ds]||[]).length>0;
let cls=“cal-day”;
if(isTod) cls+=” tod”;
if(dis)   cls+=” dis”;
if(isSel) cls+=” sel”;
if(hasBlk&&!dis) cls+=” dot”;
cells+=`<div class="${cls}" data-cal="${ns}" data-date="${ds}" data-dis="${dis?1:0}">${d}</div>`;
}

return ` <div class="cal-nav"> <button id="${ns}PrevM" ${canPrev?"":"disabled"}>‹</button> <span class="cal-month">${yr}年 ${mo+1}月</span> <button id="${ns}NextM">›</button> </div> <div class="cal-grid"> ${DAYS.map(d=>`<div class="cal-lbl">${d}</div>`).join("")} ${cells} </div>`;
}

function buildTimeSlots(blocked, booked, sel, ns){
return `<div class="time-grid">${SLOTS.map(t=>{ const isBlk = blocked.includes(t); const isBkd = !!booked[t]; const isSel = sel===t; let cls="slot"; if(isBkd) cls+=" bkd"; else if(isBlk) cls+=" blk"; else if(isSel) cls+=" sel"; const st = isBkd?"× 予約済":isBlk?"× 対応不可":"○ 空き"; return `<div class="${cls}" data-slot="${t}" data-ns="${ns}">
${t}<div class="slot-st">${st}</div>
</div>`; }).join("")}</div>`;
}

function buildAdminSlots(blocked, booked){
return `<div class="time-grid">${SLOTS.map(t=>{ const isBkd = !!booked[t]; const isBlk = blocked.includes(t); let cls="slot"; if(isBkd) cls+=" a-bkd"; else if(isBlk) cls+=" a-blk"; else cls+=" a-free"; const st = isBkd?"予約済":isBlk?"× ブロック":"○ 対応可"; return `<div class="${cls}" data-admin-slot="${t}">
${t}<div class="slot-st">${st}</div>
</div>`; }).join("")}</div>`;
}

function buildPinModal(){
return ` <div class="overlay" id="overlay"> <div class="modal" id="modal"> <h2>🔒 管理者ログイン</h2> <p>PINコードを入力してください</p> <input class="pin-in" type="password" maxlength="4" placeholder="••••" id="pinIn" autocomplete="off"> <div class="pin-err" id="pinErr"></div> <div class="modal-btns"> <button class="btn-sm btn-o" id="pinCancel" style="background:#f1f5f9;color:#475569">キャンセル</button> <button class="btn-sm btn-p" id="pinOk" style="background:linear-gradient(135deg,#1a3a5c,#2563a8);color:#fff">ログイン</button> </div> </div> </div>`;
}

function esc(s){ return String(s||””).replace(/&/g,”&”).replace(/</g,”<”).replace(/>/g,”>”).replace(/”/g,”"”); }

// ── Event binding ─────────────────────────────────────────────
function bindEvents(){
// Admin btn
q(“adminBtn”)?.addEventListener(“click”,()=>{
if(state.isAdmin){ state.isAdmin=false; state.tab=“customer”; render(); }
else{ state.showPin=true; render(); }
});

// Tabs
qa(”[data-tab]”).forEach(el=>el.addEventListener(“click”,()=>{
state.tab=el.dataset.tab; render();
}));

// Calendar days
qa(”[data-cal]”).forEach(el=>el.addEventListener(“click”,()=>{
if(el.dataset.dis===“1”) return;
const d = new Date(el.dataset.date+“T00:00:00”);
if(el.dataset.cal===“cust”){
state.selDate=d; state.selTime=null; state.step=2; render();
} else {
state.adminDate=d; render();
}
}));

// Cal month nav
q(“custPrevM”)?.addEventListener(“click”,()=>{ state.custMonth=addMonth(state.custMonth,-1); render(); });
q(“custNextM”)?.addEventListener(“click”,()=>{ state.custMonth=addMonth(state.custMonth,1); render(); });
q(“adminPrevM”)?.addEventListener(“click”,()=>{ state.adminMonth=addMonth(state.adminMonth,-1); render(); });
q(“adminNextM”)?.addEventListener(“click”,()=>{ state.adminMonth=addMonth(state.adminMonth,1); render(); });

// Customer time slots
qa(”[data-slot]”).forEach(el=>el.addEventListener(“click”,()=>{
if(el.classList.contains(“blk”)||el.classList.contains(“bkd”)) return;
state.selTime=el.dataset.slot; state.step=3; render();
}));

// Form live update
q(“fType”)?.addEventListener(“change”, e=>{ state.form.type=e.target.value; });
q(“fName”)?.addEventListener(“input”,  e=>{ state.form.name=e.target.value; syncSubmit(); });
q(“fPhone”)?.addEventListener(“input”, e=>{ state.form.phone=e.target.value; syncSubmit(); });
q(“fAddress”)?.addEventListener(“input”, e=>{ state.form.address=e.target.value; syncSubmit(); });
q(“fBuilding”)?.addEventListener(“input”, e=>{ state.form.building=e.target.value; });
q(“fNotes”)?.addEventListener(“input”, e=>{ state.form.notes=e.target.value; });

// Submit
q(“submitBtn”)?.addEventListener(“click”, submitBooking);

// Reset
q(“resetBtn”)?.addEventListener(“click”,()=>{
state.step=1; state.selDate=null; state.selTime=null; state.doneId=null;
state.form={name:””,phone:””,type:“閉栓”,address:””,building:””,notes:””}; render();
});

// Admin slots toggle
qa(”[data-admin-slot]”).forEach(el=>el.addEventListener(“click”,()=>{
if(el.classList.contains(“a-bkd”)) return;
const t=el.dataset.adminSlot;
const ds=fmt(state.adminDate);
const cur=state.blocked[ds]||[];
state.blocked[ds]=cur.includes(t)?cur.filter(x=>x!==t):[…cur,t];
saveLS(SK_BLK, state.blocked);
state.savingMsg=true; render();
setTimeout(()=>{ state.savingMsg=false; render(); },1200);
}));

// PIN modal
const overlay=q(“overlay”);
const modal=q(“modal”);
overlay?.addEventListener(“click”,()=>{ state.showPin=false; render(); });
modal?.addEventListener(“click”,e=>e.stopPropagation());
q(“pinCancel”)?.addEventListener(“click”,()=>{ state.showPin=false; render(); });
q(“pinOk”)?.addEventListener(“click”, checkPin);
q(“pinIn”)?.addEventListener(“keydown”,e=>{ if(e.key===“Enter”) checkPin(); });
setTimeout(()=>q(“pinIn”)?.focus(),50);
}

function syncSubmit(){
const btn=q(“submitBtn”);
if(btn) btn.disabled=!(state.form.name&&state.form.phone&&state.form.address)||state.submitting;
}

function checkPin(){
const v=q(“pinIn”)?.value||””;
if(v===ADMIN_PIN){
state.showPin=false; state.isAdmin=true; state.tab=“admin”; render();
} else {
const err=q(“pinErr”); if(err) err.textContent=“PINが正しくありません”;
const inp=q(“pinIn”); if(inp){ inp.value=””; inp.focus(); }
}
}

function submitBooking(){
if(!state.form.name||!state.form.phone) return;
state.submitting=true; render();
const id=`BK${Date.now()}`;
const ds=fmt(state.selDate);
if(!state.bookings[ds]) state.bookings[ds]={};
state.bookings[ds][state.selTime]={id,…state.form,createdAt:new Date().toISOString()};
saveLS(SK_BK, state.bookings);
state.doneId=id; state.submitting=false; render();
}

function addMonth(d,n){
const r=new Date(d); r.setDate(1); r.setMonth(r.getMonth()+n); return r;
}

function q(id){ return document.getElementById(id); }
function qa(sel){ return document.querySelectorAll(sel); }

// ── Init ──────────────────────────────────────────────────────
state.blocked  = loadLS(SK_BLK);
state.bookings = loadLS(SK_BK);
render();
</script>

</body>
</html>
